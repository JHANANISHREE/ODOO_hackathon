<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discount Campaigns | Brightloop Software</title>
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="preload" href="/assets/fonts/fraunces-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar" id="app-sidebar"></aside>

    <div class="app-main">
      <header class="app-topbar"></header>

      <div class="app-content">
        <div class="page-header">
          <div>
            <div class="page-pretitle">Promotions &amp; Incentives</div>
            <h1 class="page-title">Discounts &amp; Coupons</h1>
          </div>
          <div class="page-actions">
            <button class="btn btn-primary" id="open-create-discount-btn" data-open-modal="discount-modal">+ New Discount</button>
          </div>
        </div>

        <div class="card" style="padding:0;">
          <div class="table-container" style="border:none;">
            <table class="table">
              <thead>
                <tr>
                  <th>Voucher Code</th>
                  <th>Type</th>
                  <th>Value</th>
                  <th>Restrictions</th>
                  <th>Usage Limit</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="discounts-table-body"></tbody>
            </table>
          </div>
        </div>
      </div>

      <footer class="app-footer">
        <div>Brightloop Subscription Management &bull; Odoo Hiring Hackathon</div>
        <div class="response-pill" id="perf-response-time">Response: 0.017s</div>
      </footer>
    </main>
  </div>

  <div class="modal-backdrop" id="discount-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title">Create Discount Rule</h3>
        <button class="btn btn-secondary btn-icon" data-close-modal="discount-modal">&times;</button>
      </div>
      <form id="discount-form">
        <div class="modal-body">
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
            <div class="form-group">
              <label class="form-label" for="discount-code">Discount Code</label>
              <input type="text" id="discount-code" class="form-control" placeholder="e.g. ODOO2026, SUMMER20" required style="text-transform:uppercase;">
            </div>
            <div class="form-group">
              <label class="form-label" for="discount-type">Type</label>
              <select id="discount-type" class="form-select">
                <option value="percentage">Percentage (%)</option>
                <option value="fixed">Fixed Amount ($)</option>
              </select>
            </div>
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
            <div class="form-group">
              <label class="form-label" for="discount-val">Discount Value</label>
              <input type="number" id="discount-val" class="form-control" step="0.01" min="0.01" placeholder="20.00" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="discount-limit">Usage Limit (Optional)</label>
              <input type="number" id="discount-limit" class="form-control" min="1" placeholder="e.g. 100">
            </div>
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
            <div class="form-group">
              <label class="form-label" for="discount-min-purch">Min Purchase ($)</label>
              <input type="number" id="discount-min-purch" class="form-control" step="0.01" min="0" placeholder="e.g. 500.00">
            </div>
            <div class="form-group">
              <label class="form-label" for="discount-min-qty">Min Quantity</label>
              <input type="number" id="discount-min-qty" class="form-control" min="1" placeholder="e.g. 2">
            </div>
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
            <div class="form-group">
              <label class="form-label" for="discount-start">Start Date</label>
              <input type="date" id="discount-start" class="form-control">
            </div>
            <div class="form-group">
              <label class="form-label" for="discount-end">End Date</label>
              <input type="date" id="discount-end" class="form-control">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="discount-product-id">Scope</label>
            <select id="discount-product-id" class="form-select"></select>
          </div>
          <div class="form-group" style="flex-direction:row; align-items:center; gap:0.5rem;">
            <input type="checkbox" id="discount-active" checked style="width:18px; height:18px;">
            <label for="discount-active" class="form-label" style="margin-bottom:0;">Discount campaign is active</label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-close-modal="discount-modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Discount</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/assets/js/layout.js"></script>
  <script type="module" src="/assets/js/pages/discounts.js"></script>
</body>
</html>
