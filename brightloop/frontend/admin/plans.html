<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billing Plans | Brightloop Software</title>
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar" id="app-sidebar"></aside>

    <div class="app-main">
      <header class="app-topbar"></header>

      <div class="app-content">
        <div class="page-header">
          <div>
            <div class="page-pretitle">Subscriptions &amp; Pricing</div>
            <h1 class="page-title">Billing Plans</h1>
          </div>
          <div class="page-actions">
            <button class="btn btn-primary" id="open-create-plan-btn" data-open-modal="plan-modal">+ New Plan</button>
          </div>
        </div>

        <div class="card" style="padding:0;">
          <div class="table-container" style="border:none;">
            <table class="table">
              <thead>
                <tr>
                  <th>Plan Name</th>
                  <th>Price</th>
                  <th>Billing Cycle</th>
                  <th>Availability Window</th>
                  <th>Rules &amp; Flags</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="plans-table-body"></tbody>
            </table>
          </div>
        </div>
      </div>

      <footer class="app-footer">
        <div>Brightloop Subscription Management &bull; Odoo Hiring Hackathon</div>
        <div class="response-pill" id="perf-response-time">Response: 0.019s</div>
      </footer>
    </main>
  </div>

  <div class="modal-backdrop" id="plan-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-plan-title">Create Billing Plan</h3>
        <button class="btn btn-secondary btn-icon" data-close-modal="plan-modal">&times;</button>
      </div>
      <form id="plan-form">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="plan-name">Plan Name</label>
            <input type="text" id="plan-name" class="form-control" placeholder="e.g. Starter Loop" required>
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
            <div class="form-group">
              <label class="form-label" for="plan-price">Base Price ($)</label>
              <input type="number" id="plan-price" class="form-control" step="0.01" min="0.01" placeholder="49.00" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="plan-period">Billing Period</label>
              <select id="plan-period" class="form-select">
                <option value="daily">Daily</option>
                <option value="weekly">Weekly</option>
                <option value="monthly" selected>Monthly</option>
                <option value="yearly">Yearly</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="plan-min-qty">Minimum Quantity</label>
            <input type="number" id="plan-min-qty" class="form-control" min="1" value="1" required>
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
            <div class="form-group">
              <label class="form-label" for="plan-avail-from">Available From</label>
              <input type="date" id="plan-avail-from" class="form-control">
            </div>
            <div class="form-group">
              <label class="form-label" for="plan-avail-to">Available To</label>
              <input type="date" id="plan-avail-to" class="form-control">
            </div>
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.75rem; margin-top:0.5rem;">
            <div class="form-group" style="flex-direction:row; align-items:center; gap:0.5rem;">
              <input type="checkbox" id="plan-pausable" checked style="width:18px; height:18px;">
              <label for="plan-pausable" class="form-label" style="margin-bottom:0;">Pausable</label>
            </div>
            <div class="form-group" style="flex-direction:row; align-items:center; gap:0.5rem;">
              <input type="checkbox" id="plan-renewable" checked style="width:18px; height:18px;">
              <label for="plan-renewable" class="form-label" style="margin-bottom:0;">Renewable</label>
            </div>
            <div class="form-group" style="flex-direction:row; align-items:center; gap:0.5rem;">
              <input type="checkbox" id="plan-closable" checked style="width:18px; height:18px;">
              <label for="plan-closable" class="form-label" style="margin-bottom:0;">Closable</label>
            </div>
            <div class="form-group" style="flex-direction:row; align-items:center; gap:0.5rem;">
              <input type="checkbox" id="plan-auto-close" style="width:18px; height:18px;">
              <label for="plan-auto-close" class="form-label" style="margin-bottom:0;">Auto-close</label>
            </div>
          </div>
          <div class="form-group" style="flex-direction:row; align-items:center; gap:0.5rem; margin-top:0.5rem;">
            <input type="checkbox" id="plan-active" checked style="width:18px; height:18px;">
            <label for="plan-active" class="form-label" style="margin-bottom:0;">Plan is active</label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-close-modal="plan-modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Plan</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/assets/js/layout.js"></script>
  <script type="module" src="/assets/js/pages/plans.js"></script>
</body>
</html>
