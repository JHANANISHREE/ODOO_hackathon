<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tax Rules | Brightloop Software</title>
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="preload" href="/assets/fonts/fraunces-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar" id="app-sidebar"></aside>

    <div class="app-main">
      <header class="app-topbar"></header>

      <div class="app-content">
        <div class="page-header">
          <div>
            <div class="page-pretitle">Finance &amp; Fiscal</div>
            <h1 class="page-title">Tax Rules</h1>
          </div>
          <div class="page-actions">
            <button class="btn btn-primary" id="open-create-tax-btn" data-open-modal="tax-modal">+ New Tax Rule</button>
          </div>
        </div>

        <div class="card" style="padding:0;">
          <div class="table-container" style="border:none;">
            <table class="table">
              <thead>
                <tr>
                  <th>Rule Name</th>
                  <th>Type</th>
                  <th>Rate</th>
                  <th>Category Filter</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="taxes-table-body"></tbody>
            </table>
          </div>
        </div>
      </div>

      <footer class="app-footer">
        <div>Brightloop Subscription Management &bull; Odoo Hiring Hackathon</div>
        <div class="response-pill" id="perf-response-time">Response: 0.016s</div>
      </footer>
    </main>
  </div>

  <div class="modal-backdrop" id="tax-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-tax-title">Create Tax Rule</h3>
        <button class="btn btn-secondary btn-icon" data-close-modal="tax-modal">&times;</button>
      </div>
      <form id="tax-form">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="tax-name">Tax Rule Name</label>
            <input type="text" id="tax-name" class="form-control" placeholder="e.g. GST 18%, VAT Standard" required>
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
            <div class="form-group">
              <label class="form-label" for="tax-type">Tax Type</label>
              <select id="tax-type" class="form-select">
                <option value="percentage">Percentage (%)</option>
                <option value="fixed">Fixed Amount ($)</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="tax-rate">Rate</label>
              <input type="number" id="tax-rate" class="form-control" step="0.0001" min="0" placeholder="18.00" required>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="tax-category">Applies to Category (Optional)</label>
            <input type="text" id="tax-category" class="form-control" placeholder="e.g. software, service, physical">
          </div>
          <div class="form-group" style="flex-direction:row; align-items:center; gap:0.5rem;">
            <input type="checkbox" id="tax-active" checked style="width:18px; height:18px;">
            <label for="tax-active" class="form-label" style="margin-bottom:0;">Tax rule is active</label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-close-modal="tax-modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Tax Rule</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/assets/js/layout.js"></script>
  <script type="module" src="/assets/js/pages/taxes.js"></script>
</body>
</html>
