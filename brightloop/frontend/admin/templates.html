<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quotation Templates | Brightloop Software</title>
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="preload" href="/assets/fonts/fraunces-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar" id="app-sidebar"></aside>

    <div class="app-main">
      <header class="app-topbar"></header>

      <div class="app-content">
        <div class="page-header">
          <div>
            <div class="page-pretitle">Sales &amp; Proposals</div>
            <h1 class="page-title">Quotation Templates</h1>
          </div>
          <div class="page-actions">
            <button class="btn btn-primary" id="open-create-template-btn" data-open-modal="template-modal">+ New Template</button>
          </div>
        </div>

        <div class="card" style="padding:0;">
          <div class="table-container" style="border:none;">
            <table class="table">
              <thead>
                <tr>
                  <th>Template Name</th>
                  <th>Associated Plan</th>
                  <th>Validity Days</th>
                  <th>Preconfigured Lines</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="templates-table-body"></tbody>
            </table>
          </div>
        </div>
      </div>

      <footer class="app-footer">
        <div>Brightloop Subscription Management &bull; Odoo Hiring Hackathon</div>
        <div class="response-pill" id="perf-response-time">Response: 0.018s</div>
      </footer>
    </main>
  </div>

  <div class="modal-backdrop" id="template-modal">
    <div class="modal-dialog modal-lg">
      <div class="modal-header">
        <h3 class="modal-title">Create Quotation Template</h3>
        <button class="btn btn-secondary btn-icon" data-close-modal="template-modal">&times;</button>
      </div>
      <form id="template-form">
        <div class="modal-body">
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
            <div class="form-group">
              <label class="form-label" for="template-name">Template Name</label>
              <input type="text" id="template-name" class="form-control" placeholder="e.g. Odoo Standard Suite Package" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="template-validity">Validity (Days)</label>
              <input type="number" id="template-validity" class="form-control" min="1" value="30" required>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="template-plan-id">Associated Billing Plan</label>
            <select id="template-plan-id" class="form-select" required></select>
          </div>

          <div style="border-top:1px solid var(--border); padding-top:1.25rem; margin-top:1rem;">
            <h4 style="font-size:1.05rem; margin-bottom:0.75rem;">Template Product Lines</h4>
            <div style="display:grid; grid-template-columns:2fr 1fr 1fr auto; gap:0.75rem; align-items:end; margin-bottom:1rem;">
              <div class="form-group" style="margin-bottom:0;">
                <label class="form-label" for="line-product-select">Product</label>
                <select id="line-product-select" class="form-select"></select>
              </div>
              <div class="form-group" style="margin-bottom:0;">
                <label class="form-label" for="line-qty">Quantity</label>
                <input type="number" id="line-qty" class="form-control" min="1" value="1">
              </div>
              <div class="form-group" style="margin-bottom:0;">
                <label class="form-label" for="line-price">Unit Price ($)</label>
                <input type="number" id="line-price" class="form-control" step="0.01" min="0.01" placeholder="Auto">
              </div>
              <button type="button" class="btn btn-secondary" id="add-line-btn" style="height:42px;">+ Add Line</button>
            </div>

            <div id="template-lines-list"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-close-modal="template-modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Template</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/assets/js/layout.js"></script>
  <script type="module" src="/assets/js/pages/templates.js"></script>
</body>
</html>
