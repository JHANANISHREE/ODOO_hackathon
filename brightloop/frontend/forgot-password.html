<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Brightloop Software</title>
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="preload" href="/assets/fonts/fraunces-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; background-color:var(--cream-50); padding:1.5rem;">
  <div class="card" style="width:100%; max-width:440px; padding:2.5rem 2.25rem;">
    <div style="text-align:center; margin-bottom:2rem;">
      <a href="/" style="display:inline-flex; align-items:center; gap:0.6rem; margin-bottom:1rem;">
        <div class="brand-icon">B</div>
        <span class="brand-name" style="color:var(--maroon-900); font-size:1.6rem;">Brightloop</span>
      </a>
      <h2 style="font-size:1.6rem; margin-bottom:0.35rem;">Forgot password?</h2>
      <p class="text-muted" style="font-size:0.88rem;">Enter your email to receive a secure recovery link</p>
    </div>

    <form id="forgot-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="forgot-email">Email Address</label>
        <input type="email" id="forgot-email" class="form-control" placeholder="name@company.com" required autocomplete="email">
        <div class="form-error" id="forgot-email-error"></div>
      </div>

      <div id="dev-link-container" style="display:none; margin-bottom:1rem; padding:0.85rem; background-color:var(--info-bg); border-radius:var(--radius-md); font-size:0.82rem; color:var(--info-ink); word-break:break-all;">
        <strong>Development Mode:</strong> Reset link:
        <a id="dev-link-anchor" href="#" style="font-weight:600; text-decoration:underline;">Click to reset password</a>
      </div>

      <button type="submit" id="forgot-submit-btn" class="btn btn-primary btn-lg" style="width:100%; margin-bottom:1.5rem;">
        Send Recovery Link
      </button>

      <div style="text-align:center; font-size:0.88rem; color:var(--muted);">
        Remembered your password? <a href="/login.html" style="color:var(--maroon-900); font-weight:600;">Back to sign in</a>
      </div>
    </form>
  </div>

  <script type="module">
    import { requestPasswordReset } from '/assets/js/auth.js';
    import { isValidEmail, setFieldError, clearFieldError } from '/assets/js/validators.js';

    const form = document.getElementById('forgot-form');
    const emailInput = document.getElementById('forgot-email');
    const emailError = document.getElementById('forgot-email-error');
    const submitBtn = document.getElementById('forgot-submit-btn');
    const devContainer = document.getElementById('dev-link-container');
    const devAnchor = document.getElementById('dev-link-anchor');

    emailInput.addEventListener('input', () => clearFieldError(emailInput, emailError));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearFieldError(emailInput, emailError);
      devContainer.style.display = 'none';

      const email = emailInput.value.trim();
      if (!email) {
        setFieldError(emailInput, emailError, 'Email address is required');
        return;
      }
      if (!isValidEmail(email)) {
        setFieldError(emailInput, emailError, 'Entered email is invalid');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending link...';

      try {
        const res = await requestPasswordReset(email);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Recovery Link';
        if (res.dev_reset_link) {
          devAnchor.href = res.dev_reset_link;
          devAnchor.textContent = res.dev_reset_link;
          devContainer.style.display = 'block';
        }
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Recovery Link';
      }
    });
  </script>
</body>
</html>
