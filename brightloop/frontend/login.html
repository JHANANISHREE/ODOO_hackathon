<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Brightloop Software</title>
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; background-color:var(--cream-50); padding:1.5rem;">
  <div class="card" style="width:100%; max-width:440px; padding:2.5rem 2.25rem;">
    <div style="text-align:center; margin-bottom:2rem;">
      <a href="/" style="display:inline-flex; align-items:center; gap:0.6rem; margin-bottom:1rem;">
        <div class="brand-icon">B</div>
        <span class="brand-name" style="color:var(--maroon-900); font-size:1.6rem;">Brightloop</span>
      </a>
      <h2 style="font-size:1.6rem; margin-bottom:0.35rem;">Welcome back</h2>
      <p class="text-muted" style="font-size:0.88rem;">Sign in to manage subscriptions and invoices</p>
    </div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="login-email">Email Address</label>
        <input type="email" id="login-email" class="form-control" placeholder="name@company.com" required autocomplete="email">
        <div class="form-error" id="login-email-error"></div>
      </div>

      <div class="form-group">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <label class="form-label" for="login-password">Password</label>
          <a href="/forgot-password.html" style="font-size:0.8rem; color:var(--maroon-800);">Forgot password?</a>
        </div>
        <input type="password" id="login-password" class="form-control" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required autocomplete="current-password">
        <div class="form-error" id="login-password-error"></div>
      </div>

      <div class="form-error" id="login-general-error" style="text-align:center; margin-bottom:1rem;"></div>

      <button type="submit" id="login-submit-btn" class="btn btn-primary btn-lg" style="width:100%; margin-bottom:1.5rem;">
        Sign In
      </button>

      <div style="text-align:center; font-size:0.88rem; color:var(--muted);">
        Don't have an account? <a href="/signup.html" style="color:var(--maroon-900); font-weight:600;">Sign up</a>
      </div>
    </form>
  </div>

  <script type="module">
    import { redirectIfAuthenticated } from '/assets/js/guards.js';
    import { loginUser } from '/assets/js/auth.js';
    import { isValidEmail, setFieldError, clearFieldError } from '/assets/js/validators.js';

    redirectIfAuthenticated();

    const form = document.getElementById('login-form');
    const emailInput = document.getElementById('login-email');
    const passwordInput = document.getElementById('login-password');
    const emailError = document.getElementById('login-email-error');
    const passwordError = document.getElementById('login-password-error');
    const generalError = document.getElementById('login-general-error');
    const submitBtn = document.getElementById('login-submit-btn');

    emailInput.addEventListener('input', () => clearFieldError(emailInput, emailError));
    passwordInput.addEventListener('input', () => clearFieldError(passwordInput, passwordError));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearFieldError(emailInput, emailError);
      clearFieldError(passwordInput, passwordError);
      generalError.textContent = '';

      let isValid = true;
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email) {
        setFieldError(emailInput, emailError, 'Email address is required');
        isValid = false;
      } else if (!isValidEmail(email)) {
        setFieldError(emailInput, emailError, 'Entered email is invalid');
        isValid = false;
      }

      if (!password) {
        setFieldError(passwordInput, passwordError, 'Password is required');
        isValid = false;
      }

      if (!isValid) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      try {
        await loginUser(email, password);
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
        if (err.fields && err.fields.email) {
          setFieldError(emailInput, emailError, err.fields.email);
        } else if (err.fields && err.fields.password) {
          setFieldError(passwordInput, passwordError, err.fields.password);
        } else {
          generalError.textContent = err.message || 'Invalid credentials. Please verify and try again.';
        }
      }
    });
  </script>
</body>
</html>
