<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password | Brightloop Software</title>
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="preload" href="/assets/fonts/fraunces-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; background-color:var(--cream-50); padding:2rem 1.5rem;">
  <div class="card" style="width:100%; max-width:480px; padding:2.5rem 2.25rem;">
    <div style="text-align:center; margin-bottom:1.75rem;">
      <a href="/" style="display:inline-flex; align-items:center; gap:0.6rem; margin-bottom:1rem;">
        <div class="brand-icon">B</div>
        <span class="brand-name" style="color:var(--maroon-900); font-size:1.6rem;">Brightloop</span>
      </a>
      <h2 style="font-size:1.6rem; margin-bottom:0.35rem;">Set new password</h2>
      <p class="text-muted" style="font-size:0.88rem;">Ensure your new credentials meet security requirements</p>
    </div>

    <form id="reset-form" novalidate>
      <input type="hidden" id="reset-token">

      <div class="form-group">
        <label class="form-label" for="reset-password">New Password</label>
        <input type="password" id="reset-password" class="form-control" placeholder="Create strong password" required autocomplete="new-password">
        <div class="form-error" id="reset-password-error"></div>

        <ul class="checklist" id="reset-checklist">
          <li class="checklist-item" data-rule="length">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
            <span>More than 8 characters</span>
          </li>
          <li class="checklist-item" data-rule="upper">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
            <span>At least 1 uppercase letter (A-Z)</span>
          </li>
          <li class="checklist-item" data-rule="lower">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
            <span>At least 1 lowercase letter (a-z)</span>
          </li>
          <li class="checklist-item" data-rule="special">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
            <span>At least 1 special character (!@#$%^&amp;*...)</span>
          </li>
        </ul>
      </div>

      <div class="form-error" id="reset-general-error" style="text-align:center; margin-bottom:1rem;"></div>

      <button type="submit" id="reset-submit-btn" class="btn btn-primary btn-lg" style="width:100%; margin-bottom:1.5rem;" disabled>
        Save New Password
      </button>

      <div style="text-align:center; font-size:0.88rem; color:var(--muted);">
        Back to <a href="/login.html" style="color:var(--maroon-900); font-weight:600;">Sign in</a>
      </div>
    </form>
  </div>

  <script type="module">
    import { resetPassword } from '/assets/js/auth.js';
    import { updatePasswordChecklistUI, setFieldError, clearFieldError } from '/assets/js/validators.js';

    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    const form = document.getElementById('reset-form');
    const tokenInput = document.getElementById('reset-token');
    const passwordInput = document.getElementById('reset-password');
    const passwordError = document.getElementById('reset-password-error');
    const generalError = document.getElementById('reset-general-error');
    const submitBtn = document.getElementById('reset-submit-btn');

    if (!token) {
      generalError.textContent = 'Missing recovery token. Please request a new password reset link.';
    } else {
      tokenInput.value = token;
    }

    passwordInput.addEventListener('input', () => {
      clearFieldError(passwordInput, passwordError);
      generalError.textContent = '';
      const isStrong = updatePasswordChecklistUI(passwordInput.value, 'reset-checklist');
      submitBtn.disabled = !isStrong || !token;
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearFieldError(passwordInput, passwordError);
      generalError.textContent = '';

      const currentToken = tokenInput.value;
      const newPassword = passwordInput.value;

      if (!currentToken) {
        generalError.textContent = 'Invalid recovery link. Please request a new link.';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating password...';

      try {
        await resetPassword(currentToken, newPassword);
        setTimeout(() => {
          window.location.href = '/login.html';
        }, 1200);
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Save New Password';
        if (err.fields && err.fields.new_password) {
          setFieldError(passwordInput, passwordError, err.fields.new_password);
        } else {
          generalError.textContent = err.message || 'Failed to reset password.';
        }
      }
    });
  </script>
</body>
</html>
